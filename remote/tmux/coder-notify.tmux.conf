# coder-notify: tell the Mac when you focus a tmux pane, so its alert clears.
#
# Load it from ~/.tmux.conf with:
#   source-file -q ~/.config/coder-notify/coder-notify.tmux.conf
#
# focus-events makes tmux ask your terminal (Ghostty) to report focus
# changes. pane-focus-in then fires when you switch to a pane, window or
# session, and when the terminal window itself gets focus. After turning it
# on, detach and re-attach your tmux clients once.
set -g focus-events on

# The [42] index gives our hook its own slot, so re-loading this file never
# adds a duplicate and your other pane-focus-in hooks are left alone.
# -b runs it in the background; output is discarded so nothing is ever shown
# in your pane.
set-hook -g pane-focus-in[42] 'run-shell -b "$HOME/.local/bin/coder-notify-remote focus #{pane_id} >/dev/null 2>&1 || true"'
